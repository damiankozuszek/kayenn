# Installation packages of KAYENN for Windows, macOS (Apple Silicon and Intel) and Linux.
# User's rule: a release is PUBLISHED ONLY WHEN THE PACKAGES OF ALL SYSTEMS ARE READY (no update notice before the
# file for the user's computer exists).
# - push a v* tag (e.g. v0.3.0): a draft release is created (text .github/RELEASE_BODY.md), every system builds and
#   adds its packages to it; when the last one is in, the release is published;
# - scheduled (hourly check; retries hourly for 3 h, then every 6 h): the systems still missing in the newest draft
#   are built again – GitHub cancels a job that got no runner (e.g. no free macOS arm64 machine), so the draft
#   simply waits until it gets one (a run with nothing to build succeeds – no failure e-mail);
# - Actions → „Installation packages” → Run workflow: tag empty – a test build of the branch (artifacts only);
#   with a tag – the packages of that release (the systems given, else the missing ones).
# Which release and which systems: .github/release_plan.py.
name: Installation packages

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.0); empty – a test build of the branch, no release"
        required: false
        default: ""
      systems:
        description: "Systems: Windows, macOS, macOS-Intel, Linux (comma separated); empty – the missing ones / all"
        required: false
        default: ""

permissions:
  contents: write

concurrency:                          # one release run at a time – the next waits (no double builds / uploads)
  group: packages-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      matrix: ${{ steps.p.outputs.matrix }}
      any: ${{ steps.p.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_TAG: ${{ inputs.tag }}
          IN_SYSTEMS: ${{ inputs.systems }}
        run: python .github/release_plan.py

  package:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    name: ${{ matrix.name }}
    continue-on-error: true           # a system without a runner is retried by the hourly run
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libasound2 xvfb \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libxcb-xkb1

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Python packages
        run: python -m pip install -r packaging/requirements.txt

      - name: Build package
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: KAYENN-${{ matrix.name }}
          path: |
            dist/*
            !dist/screenshots-*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.name }}
          path: dist/screenshots-*

      - name: Add the packages to the release
        if: needs.plan.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find dist -maxdepth 1 -type f)
          echo "$files"
          gh release upload "${{ needs.plan.outputs.tag }}" $files --clobber --repo "${{ github.repository }}"

  publish:
    needs: [plan, package]
    if: always() && needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release when all the packages are in it
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/release_plan.py finalize "${{ needs.plan.outputs.tag }}"
