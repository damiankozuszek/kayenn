# Tests and installation packages of KAYENN for Windows, macOS and Linux.
# Run: Actions tab → „Installation packages” → Run workflow, or push a v* tag (e.g. v0.1.0) –
# then the packages also go to a draft release (Releases).
name: Installation packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-15 }
          - { name: macOS-Intel, os: macos-15-intel }
          - { name: Linux, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libasound2 xvfb \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libxcb-xkb1

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Python packages
        run: python -m pip install -r packaging/requirements.txt

      - name: Program tests
        run: python tests.py --quick

      - name: Build package
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: KAYENN-${{ matrix.name }}
          path: |
            dist/*
            !dist/screenshots-*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.name }}
          path: dist/screenshots-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: KAYENN-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*              # the artifacts are downloaded to release/ (not packaging/)
          fail_on_unmatched_files: true # without this a wrong path silently gave a release with only the source code
          draft: true
