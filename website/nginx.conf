server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;   # /pl → /pl/ relative, so it keeps https behind NPM

    # HTTPS and the certificate are handled by Nginx Proxy Manager in front of this container.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src https://api.github.com" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location /img/ {
        expires 7d;
        add_header Cache-Control "public";
        # add_header in a location drops the server-level ones – repeat them
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
